<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dev Days Quiz</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <section id="start-screen">
      <h1>Dev Days Quiz</h1>
      <p class="lead">Six quick questions about Git, GitHub and Copilot.</p>
      <button id="start-btn" class="primary">Start quiz</button>
    </section>

    <section id="quiz-screen" hidden>
      <p id="progress" class="muted"></p>
      <div id="timer" class="timer" role="timer" aria-label="Time remaining" aria-live="off">
        <div class="timer-ring" aria-hidden="true">
          <svg viewBox="0 0 40 40">
            <circle class="timer-ring-track" cx="20" cy="20" r="16" pathLength="100"></circle>
            <circle id="timer-progress" class="timer-ring-progress" cx="20" cy="20" r="16" pathLength="100"></circle>
          </svg>
          <span id="timer-display">⏱ 15s</span>
        </div>
        <div class="timer-copy">
          <p class="timer-label">Beat the clock!</p>
          <p id="timer-hint" class="timer-hint">Lock in your answer before time runs out.</p>
        </div>
      </div>
      <h2 id="question-text"></h2>
      <ul id="options"></ul>
      <p id="feedback" aria-live="polite"></p>
      <button id="next-btn" class="primary" hidden>Next question</button>
    </section>

    <section id="result-screen" hidden>
      <h2>Quiz complete</h2>
      <p id="score-text" class="lead"></p>
      <p id="grade-text"></p>
      <button id="restart-btn" class="primary">Play again</button>
    </section>
  </main>

  <!-- Order matters: questions and logic load before the UI code -->
  <script src="questions.js"></script>
  <script src="quiz.js"></script>
  <script src="app.js"></script>
</body>
</html>
